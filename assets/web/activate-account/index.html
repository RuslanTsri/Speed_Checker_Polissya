<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Metrics — Success</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #050505; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .glow-orange { position: absolute; bottom: -20%; width: 100%; height: 60%; background: radial-gradient(ellipse at 50% 100%, rgba(255, 109, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%); z-index: 1; }
        .card { position: relative; z-index: 10; width: 90%; max-width: 420px; background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; padding: 50px 30px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .status-icon { width: 80px; height: 80px; background: #ffffff; border: 2px solid #FF6D00; border-radius: 24px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255, 109, 0, 0.2); }
        .status-icon img { width: 50px; height: 50px; object-fit: contain; }
        h1 { color: #fff; font-size: 26px; margin: 0 0 12px; font-weight: 800; }
        p { color: #A3A3A3; font-size: 15px; line-height: 1.6; margin-bottom: 35px; }
        .btn { display: inline-block; padding: 18px 40px; border-radius: 16px; background: linear-gradient(135deg, #FF6D00 0%, #E65100 100%); color: white; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="glow-orange"></div>
<div class="card">

    <div class="status-icon">
        <img src="https://bejewelled-sorbet-f2399d.netlify.app/public/tempometrics_black.png" alt="Tempo Metrics">
    </div>

    <h1 id="header">Активація успішна</h1>
    <p id="msg">Email підтверджено. Тепер ви можете повернутися в додаток <b>Tempo Metrics</b> та увійти у свій профіль.</p>
    <a href="#" onclick="window.close()" class="btn" id="btn-text">ГОТОВО</a>
</div>

<script>
    const translations = {
        en: {
            header: "Activation Success",
            msg: "Your email has been verified. You can now return to the <b>Tempo Metrics</b> app and log in.",
            btn: "DONE"
        },
        uk: {
            header: "Активація успішна",
            msg: "Email підтверджено. Тепер ви можете повернутися в додаток <b>Tempo Metrics</b> та увійти у свій профіль.",
            btn: "ГОТОВО"
        }
    };

    const userLang = navigator.language || navigator.userLanguage;
    const lang = (userLang.startsWith('uk') || userLang.startsWith('ru')) ? 'uk' : 'en';

    document.getElementById('header').innerText = translations[lang].header;
    document.getElementById('msg').innerHTML = translations[lang].msg;
    document.getElementById('btn-text').innerText = translations[lang].btn;
</script>
</body>
</html>
